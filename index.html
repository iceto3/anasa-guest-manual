<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anasa Manual">
  <meta name="description" content="Offline guest manual for Anasa, a Fountaine Pajot Isla 40 by Anasa Experiences.">
  <title>Anasa Guest Manual · Anasa Experiences</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav" id="nav">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden></button>
    <button class="brand" id="brand" aria-label="Anasa Experiences">
      <img class="logo" src="logo-badge.png" alt="Anasa Experiences" width="1024" height="1024">
    </button>
    <div class="nav-title" id="navTitle"></div>
    <div class="lang">
      <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu"></button>
      <div class="lang-menu" id="langMenu" role="menu" hidden></div>
    </div>
    <a class="sos" id="sosBtn" href="#/emergency" aria-label="Emergency"><span class="sos-dot"></span>SOS</a>
  </header>
  <main id="app" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <!-- Data: central config → languages → boats → app. Add a language or a boat by adding one script here (see README.md). -->
  <script src="config.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/el.js"></script>
  <script src="lang/bg.js"></script>
  <script src="lang/de.js"></script>
  <script src="boats/anasa.js"></script>
  <script src="app.js"></script>
</body>
</html>
